[package]
name = "xur-std"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The standard library of the Xur language"

[lib]
name = "xur_std"
path = "src/lib.rs"

[features]
default = ["cli"]
cli = ["dep:pico-args", "dep:inquire", "dep:comfy-table"]

[dependencies]
xur-ast.workspace = true
xur-resolve.workspace = true
xur-runtime.workspace = true
xur-span.workspace = true
facet.workspace = true
pewter.workspace = true
procodile.workspace = true
bitflags.workspace = true
hao.workspace = true
hao-il2cpp.workspace = true
hao-runtime.workspace = true
iced-x86.workspace = true
serde.workspace = true
serde_json.workspace = true
dashmap.workspace = true
comfy-table = { workspace = true, optional = true }
pico-args = { workspace = true, optional = true }
inquire = { workspace = true, optional = true }

[dev-dependencies]
xur-runtime = { workspace = true, features = ["testing"] }
