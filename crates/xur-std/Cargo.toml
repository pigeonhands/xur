[package]
name = "xur-std"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The standard library of the Xur language"

[lib]
name = "xur_std"
path = "src/lib.rs"

[features]
default = ["cli", "http", "regex", "datetime", "json", "re", "gui"]
cli               = ["dep:pico-args", "dep:inquire", "dep:comfy-table"]
http              = ["dep:ureq"]
regex             = ["dep:regex"]
datetime          = ["dep:chrono"]
json              = ["dep:serde", "dep:serde_json"]
re-image          = ["dep:pewter"]
re-proc           = ["dep:procodile"]
re-asm            = ["dep:iced-x86"]
re-dotnet         = ["dep:hao"]
re-dotnet-il2cpp  = ["re-dotnet", "dep:hao-il2cpp"]
re-dotnet-runtime = ["re-dotnet", "dep:hao-runtime"]
re                = ["re-image", "re-proc", "re-asm", "re-dotnet", "re-dotnet-il2cpp", "re-dotnet-runtime"]
gui               = ["dep:eframe", "dep:winit"]

[dependencies]
xur-ast.workspace = true
xur-resolve.workspace = true
xur-runtime.workspace = true
xur-span.workspace = true
facet.workspace = true
bitflags.workspace = true
pewter = { workspace = true, optional = true }
procodile = { workspace = true, optional = true }
hao = { workspace = true, optional = true }
hao-il2cpp = { workspace = true, optional = true }
hao-runtime = { workspace = true, optional = true }
iced-x86 = { workspace = true, optional = true }
ureq = { workspace = true, optional = true }
regex = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }
eframe = { version = "0.37", optional = true }
winit = { version = "0.30", optional = true }

[target.'cfg(unix)'.dependencies]
libc.workspace = true
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
dashmap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
comfy-table = { workspace = true, optional = true }
pico-args = { workspace = true, optional = true }
inquire = { workspace = true, optional = true }

[dev-dependencies]
xur-runtime = { workspace = true, features = ["testing"] }
