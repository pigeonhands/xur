[package]
name = "xur-std"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The standard library of the Xur language"

[lib]
name = "xur_std"
path = "src/lib.rs"

[features]
default = ["cli", "http", "regex", "datetime", "json", "re", "gui", "random", "hash"]
random            = ["dep:rand"]
hash              = ["dep:sha2", "dep:md-5", "dep:crc32fast"]
cli               = ["dep:pico-args", "dep:inquire", "dep:comfy-table"]
http              = ["dep:ureq"]
regex             = ["dep:regex"]
datetime          = ["dep:chrono"]
json              = ["dep:serde", "dep:serde_json"]
re-image          = ["dep:pewter"]
re-proc           = ["dep:procodile"]
re-asm            = ["dep:iced-x86"]
re-dotnet         = ["dep:hao"]
re-dotnet-il2cpp  = ["re-dotnet", "dep:hao-il2cpp"]
re-dotnet-runtime = ["re-dotnet", "dep:hao-runtime"]
re-demangle       = ["dep:rekit"]
re-unreal         = ["dep:unrealkit"]
re                = ["re-image", "re-proc", "re-asm", "re-dotnet", "re-dotnet-il2cpp", "re-dotnet-runtime", "re-demangle", "re-unreal"]
gui               = ["dep:eframe", "dep:winit"]

[dependencies]
xur-ast.workspace = true
xur-resolve.workspace = true
xur-runtime.workspace = true
xur-span.workspace = true
facet.workspace = true
bitflags.workspace = true
pewter = { workspace = true, optional = true }
procodile = { workspace = true, optional = true }
hao = { workspace = true, optional = true }
hao-il2cpp = { workspace = true, optional = true }
hao-runtime = { workspace = true, optional = true }
iced-x86 = { workspace = true, optional = true }
ureq = { workspace = true, optional = true }
regex = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }
eframe = { version = "0.37", optional = true, default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
winit = { version = "0.30", optional = true }
rand = { version = "0.9", optional = true }
sha2 = { version = "0.10", optional = true }
md-5 = { version = "0.10", optional = true }
crc32fast = { version = "1", optional = true }
rekit = { workspace = true, features = ["demangle", "pattern"], optional = true }
unrealkit = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
libc.workspace = true
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
dashmap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
comfy-table = { workspace = true, optional = true }
pico-args = { workspace = true, optional = true }
inquire = { workspace = true, optional = true }

[dev-dependencies]
xur-runtime = { workspace = true, features = ["testing"] }
