[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/xur"]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/pigeonhands/xur"


[workspace.dependencies]
xur-ast = { path = "crates/xur-ast", version = "0.1.1" }
xur-bytecode = { path = "crates/xur-bytecode", version = "0.1.1" }
xur-errors = { path = "crates/xur-errors", version = "0.1.1" }
xur-jit = { path = "crates/xur-jit", version = "0.1.1" }
xur-parser = { path = "crates/xur-parser", version = "0.1.1" }
xur-resolve = { path = "crates/xur-resolve", version = "0.1.1" }
xur-runtime = { path = "crates/xur-runtime", version = "0.1.1" }
xur-std = { path = "crates/xur-std", version = "0.1.1" }
xur-vm = { path = "crates/xur-vm", version = "0.1.1" }
xur-span = { path = "crates/xur-span", version = "0.1.1" }
strum = { version = "0.27", features = ["derive"] }
unicode-ident = "1.0"
thiserror = "2.0"
anyhow = "1.0"
ariadne = "0.5"
clap = { version = "4.5", features = ["derive"] }
facet = { version = "=0.50.0-rc.7", features = ["reflect"] }
cranelift-jit = "0.137"
cranelift-module = "0.137"
