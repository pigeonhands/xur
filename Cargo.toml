[workspace]
resolver = "3"
# Executables live in top-level folders; their libraries in crates/.
members = ["xur", "xur-stub", "crates/*"]
exclude = ["crates/xur-jit"]
default-members = ["xur"]

[workspace.package]
version = "0.1.2"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/pigeonhands/xur"


[workspace.dependencies]
xur-ast = { path = "crates/xur-ast", version = "0.1.2" }
xur-bytecode = { path = "crates/xur-bytecode", version = "0.1.2" }
xur-errors = { path = "crates/xur-errors", version = "0.1.2" }
xur-jit = { path = "crates/xur-jit", version = "0.1.2" }
xur-parser = { path = "crates/xur-parser", version = "0.1.2" }
xur-resolve = { path = "crates/xur-resolve", version = "0.1.2" }
xur-runtime = { path = "crates/xur-runtime", version = "0.1.2" }
xur-std = { path = "crates/xur-std", version = "0.1.2" }
xur-vm = { path = "crates/xur-vm", version = "0.1.2" }
xur-span = { path = "crates/xur-span", version = "0.1.2" }
strum = { version = "0.27", features = ["derive"] }
unicode-ident = "1.0"
thiserror = "2.0"
anyhow = "1.0"
ariadne = "0.5"
clap = { version = "4.5", features = ["derive"] }
facet = { version = "=0.50.0-rc.7", features = ["reflect"] }
pewter = { version = "0.0.10", features = ["reflect"] }
procodile = { version = "0.3.1", default-features = false, features = ["reflect", "inject"] }
bitflags = "2.13"
hao = { version = "0.0.9", features = ["reflect"] }
hao-il2cpp = { version = "0.0.5", features = ["reflect"] }
hao-runtime = { version = "0.0.4", features = ["reflect"] }
hao-il2cpp-runtime = { version = "0.0.5", features = ["reflect"] }
hao-il2cpp-unity = { version = "0.0.6", features = ["reflect"] }
hao-godot = { version = "0.0.4", features = ["reflect"] }
hooking = "0.6"
iced-x86 = "1.21"
ureq = "3.0"
regex = "1.13"
chrono = "0.4"
libc = "0.2"
serde = "1"
serde_json = "1"
comfy-table = { version = "7.1", features = ["custom_styling"] }
dashmap = "6.1"
tower-lsp = "0.20"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std"] }
pico-args = "0.5"
inquire = { version = "0.9", features = ["editor"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
# cranelift-jit = "0.137"
# cranelift-module = "0.137"
