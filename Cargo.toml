[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/xur"]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/pigeonhands/xur"


[workspace.dependencies]
xur-ast = { path = "crates/xur-ast" }
xur-bytecode = { path = "crates/xur-bytecode" }
xur-errors = { path = "crates/xur-errors" }
xur-parser = { path = "crates/xur-parser" }
xur-resolve = { path = "crates/xur-resolve" }
xur-runtime = { path = "crates/xur-runtime" }
xur-std = { path = "crates/xur-std" }
xur-span = { path = "crates/xur-span" }
strum = { version = "0.27", features = ["derive"] }
unicode-ident = "1.0"
thiserror = "2.0"
anyhow = "1.0"
ariadne = "0.5"
clap = { version = "4.5", features = ["derive"] }
facet = { version = "=0.50.0-rc.7", features = ["reflect"] }
