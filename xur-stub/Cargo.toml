[package]
name = "xur-stub"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Shared library that embeds the Xur VM — load via LD_PRELOAD or inject into a process"

[lib]
crate-type = ["cdylib"]

[dependencies]
xur-resolve.workspace = true
xur-runtime.workspace = true
xur-std = { workspace = true, default-features = false }
xur-vm.workspace = true
xur-span.workspace = true
ctor = "0.4"
facet.workspace = true
hao-il2cpp-runtime = { workspace = true, optional = true }
hao-il2cpp-unity = { workspace = true, optional = true }
hao-godot = { workspace = true, optional = true }
tracing.workspace = true
tracing-subscriber.workspace = true
hooking = { workspace = true, optional = true }
hao-runtime = { workspace = true, optional = true }
libloading = { version = "0.9", optional = true }
libc.workspace = true

[features]
default = ["il2cpp-runtime", "il2cpp-unity", "godot", "hooking", "xur-http", "xur-regex", "xur-datetime", "xur-json", "xur-re", "xur-gui"]
hooking = ["dep:hooking", "xur-re-asm"]
hao-runtime = ["dep:hao-runtime", "hooking"]
il2cpp-runtime = ["dep:hao-il2cpp-runtime", "dep:libloading", "hooking"]
il2cpp-unity = ["dep:hao-il2cpp-unity", "il2cpp-runtime"]
godot = ["dep:hao-godot", "hao-runtime"]
egui = ["hao-il2cpp-unity/egui"]
xur-http              = ["xur-std/http"]
xur-regex             = ["xur-std/regex"]
xur-datetime          = ["xur-std/datetime"]
xur-json              = ["xur-std/json"]
xur-re-image          = ["xur-std/re-image"]
xur-re-proc           = ["xur-std/re-proc"]
xur-re-asm            = ["xur-std/re-asm"]
xur-re-dotnet         = ["xur-std/re-dotnet"]
xur-re-dotnet-il2cpp  = ["xur-std/re-dotnet-il2cpp"]
xur-re-dotnet-runtime = ["xur-std/re-dotnet-runtime"]
xur-re                = ["xur-std/re"]
xur-gui               = ["xur-std/gui"]
